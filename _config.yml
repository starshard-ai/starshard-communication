title: Starshard Communication
description: >-
  An open, user-owned communication substrate for personal AI agents: inbox,
  addressing, trust tiers, policy, receipts — and agent-to-agent identity,
  authentication, and secure messaging with no central platform.
theme: jekyll-theme-minimal
show_downloads: false

# Markdown docs in this repo are the content. No custom layouts.
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - LICENSE
  - reference-impl/
  - "*.py"
